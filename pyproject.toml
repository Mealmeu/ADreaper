[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adreaper"
version = "0.1.0"
description = "A modern, modular Active Directory penetration-testing framework."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ADreaper Contributors" }]
keywords = ["active-directory", "pentest", "red-team", "security", "ldap", "smb", "kerberos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Core runtime deps are intentionally light. AD protocol libraries are optional
# extras so the framework core stays importable/testable without a live target.
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
# Everything needed for the recon modules to talk to a real domain.
ad = [
    "impacket>=0.11.0",
    "ldap3>=2.9",
    "dnspython>=2.3",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
adreaper = "adreaper.cli:main"

[project.urls]
Homepage = "https://github.com/ADreaper/ADreaper"
Issues = "https://github.com/ADreaper/ADreaper/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["adreaper*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Deterministic, pragmatic rule set: pyflakes (real bugs) + pycodestyle.
select = ["E", "F", "W"]
# Long lines (refs/URLs/descriptions) and lazy post-metadata imports are fine.
ignore = ["E501", "E402"]
